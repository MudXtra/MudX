name: Release MudX
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: release
        options: [release, resume]
      producer_run_id:
        required: false
        type: string
      producer_attempt:
        required: false
        type: string
      bump:
        required: true
        type: choice
        options: [patch, minor, major]
      custom_version:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mudx-release
  cancel-in-progress: false
env:
  PROJECT: src/MudX/MudX.csproj
  IMAGE: ghcr.io/mudxtra/mudx/mudxdocwebsite
jobs:
  version-pr:
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    environment: mudx-release-coordination
    permissions: { contents: write, pull-requests: write }
    outputs:
      version: ${{ steps.version.outputs.value }}
      sha: ${{ steps.wait.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: dev, fetch-depth: 0, persist-credentials: false }
      - name: Bind dispatch and rerun actors
        env: { ALLOWED: "${{ vars.MUDX_RELEASE_ACTORS }}" }
        run: python3 tools/release_pipeline/release_guard.py actor --actor "$GITHUB_ACTOR" --triggering-actor "$GITHUB_TRIGGERING_ACTOR" --allowed "$ALLOWED"
      - name: Verify distinct coordinator and MudXBot identities
        env:
          COORDINATOR_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
          BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          EXPECTED_BOT: ${{ vars.MUDX_BOT_LOGIN }}
        run: |
          coordinator=$(GH_TOKEN="$COORDINATOR_TOKEN" gh api user --jq .login)
          bot=$(GH_TOKEN="$BOT_TOKEN" gh api user --jq .login)
          test -n "$EXPECTED_BOT" && test "$bot" = "$EXPECTED_BOT" && test "$bot" != "$coordinator"
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/dev
          test -z "$(gh pr list --state open --search 'head:release/version-' --json number --jq '.[0].number // empty')"
          current=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT")
          mapfile -t known < <({ gh release list --limit 100 --json tagName --jq '.[].tagName|ltrimstr("v")'; curl -fsS https://api.nuget.org/v3-flatcontainer/mudx.mudblazor.extension/index.json | jq -r '.versions[]'; } | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -Vu || true)
          args=(calculate --current "$current"); for value in "${known[@]}"; do args+=(--known "$value"); done
          if [[ -n "$CUSTOM" ]]; then args+=(--custom "$CUSTOM"); else args+=(--bump "$BUMP"); fi
          value=$(python3 tools/release_pipeline/release_guard.py "${args[@]}")
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          branch="release/version-$VERSION-$GITHUB_RUN_ID"
          git switch -c "$branch"
          cp "$PROJECT" /tmp/before
          python3 - "$PROJECT" "$VERSION" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(); updated,count=re.subn(r'(<Version>)[^<]+(</Version>)',rf'\g<1>{sys.argv[2]}\g<2>',text,count=1)
          if count!=1 or text==updated: raise SystemExit('expected one version change')
          p.write_text(updated)
          PY
          python3 tools/release_pipeline/release_guard.py version-files --before /tmp/before --after "$PROJECT" --expected "$VERSION"
          git config user.name MudXReleaseCoordinator; git config user.email release-coordinator@users.noreply.github.com
          git add "$PROJECT" && git commit -m "Release: reserve MudX $VERSION"
          gh auth setup-git && git push origin "HEAD:$branch"
          url=$(gh pr create --base dev --head "$branch" --title "[BOT] Update MudX Version to $VERSION" --body "Release run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT; exact version-only reservation.")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Revalidate current head and approve as MudXBot
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          before=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          git fetch --force origin "pull/$PR/head:refs/remotes/origin/release-pr"
          fetched=$(git rev-parse refs/remotes/origin/release-pr)
          after=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          python3 tools/release_pipeline/release_guard.py head-binding --expected "$HEAD" --observed "$before" --observed "$fetched" --observed "$after"
          test "$(git diff --name-only origin/dev...refs/remotes/origin/release-pr)" = "$PROJECT"
          git show origin/dev:"$PROJECT" >/tmp/base; git show refs/remotes/origin/release-pr:"$PROJECT" >/tmp/head
          python3 tools/release_pipeline/release_guard.py version-files --before /tmp/base --after /tmp/head --expected "$VERSION"
          now=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          python3 tools/release_pipeline/release_guard.py head-binding --expected "$HEAD" --observed "$now"
          gh pr review "$PR" --approve --body "MudXBot approval bound to run $GITHUB_RUN_ID and head $HEAD."
      - name: Revalidate exact PR head and enable protected auto-merge
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
        run: |
          now=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          python3 tools/release_pipeline/release_guard.py head-binding --expected "$HEAD" --observed "$now"
          gh pr merge "$PR" --auto --squash --delete-branch
      - id: wait
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
        run: |
          for _ in {1..120}; do
            test "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$HEAD"
            sha=$(gh pr view "$PR" --json state,mergeCommit --jq 'select(.state=="MERGED")|.mergeCommit.oid')
            if [[ -n "$sha" ]]; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          echo 'Awaiting the same version PR; do not allocate a new version.' >&2; exit 1
  build:
    needs: version-pr
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.version-pr.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Generate, build every shipped framework, docs, and tests
        run: |
          dotnet run --project src/MudX.Generator/MudX.Generator.csproj -c Release -f net10.0 -- src/MudX/wwwroot src/MudX/Scripts
          for f in net8.0 net9.0 net10.0; do dotnet build "$PROJECT" -c Release -f "$f"; done
          dotnet build src/MudX.Docs/MudX.Docs.csproj -c Release
          dotnet test tests/MudX.UnitTests/MudX.UnitTests.csproj -c Release --blame-hang --blame-hang-timeout 60s
      - name: Pack packages
        env: { VERSION: "${{ needs.version-pr.outputs.version }}" }
        run: |
          mkdir -p release-artifacts/packages
          dotnet pack "$PROJECT" -c Release --no-build -o release-artifacts/packages /p:Version="$VERSION" /p:PackageId=MudX.MudBlazor.Extension
          test "$(find release-artifacts/packages -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' | wc -l)" -eq 1
          test "$(find release-artifacts/packages -maxdepth 1 -type f -name '*.snupkg' | wc -l)" -eq 1
          pwsh tools/CheckStaticAssets.ps1 "$(find release-artifacts/packages -name '*.nupkg' ! -name '*.snupkg' -print -quit)" mudx.min.css mudx.min.js prism.js mudxProvider.js
      - name: Build image once and smoke test exact archive
        env:
          VERSION: ${{ needs.version-pr.outputs.version }}
          SHA: ${{ needs.version-pr.outputs.sha }}
        run: |
          docker buildx build src -f src/MudX.Docs.Hybrid/MudX.Docs.Hybrid/Dockerfile -t "mudx-candidate:$VERSION" --build-arg SOURCE_REVISION="$SHA" --build-arg RELEASE_VERSION="$VERSION" --output type=docker,dest=release-artifacts/image.docker.tar --output type=oci,dest=release-artifacts/image.oci.tar
          docker load -i release-artifacts/image.docker.tar
          image="mudx-candidate:$VERSION"; cid=$(docker run -d -p 127.0.0.1:4561:8080 "$image"); trap 'docker rm -f "$cid"' EXIT
          for _ in {1..30}; do curl -fsS http://127.0.0.1:4561/healthz && break; sleep 2; done
          test "$(curl -fsS http://127.0.0.1:4561/revision)" = "$SHA"
          tar -xOf release-artifacts/image.oci.tar index.json | jq -r '.manifests[0].digest' > release-artifacts/image-digest.txt
          python3 tools/release_pipeline/release_guard.py manifest-create --output release-artifacts/manifest.json --root release-artifacts --sha "$SHA" --version "$VERSION" --image-digest "$(cat release-artifacts/image-digest.txt)" --producer "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" release-artifacts/packages/* release-artifacts/image.oci.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mudx-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 30
  publish-deploy:
    if: inputs.mode == 'release'
    needs: [version-pr, build]
    runs-on: ubuntu-latest
    environment: mudx-production-release
    permissions: { actions: read, contents: write, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.version-pr.outputs.sha }}", persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "mudx-release-${{ github.run_id }}-${{ github.run_attempt }}", path: release-artifacts }
      - name: Authenticate exact producer manifest before secrets are used
        env:
          VERSION: ${{ needs.version-pr.outputs.version }}
          SHA: ${{ needs.version-pr.outputs.sha }}
        run: |
          python3 tools/release_pipeline/release_guard.py manifest-verify --manifest release-artifacts/manifest.json --root release-artifacts --sha "$SHA" --version "$VERSION" --producer "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Publish immutable image, packages, deploy digest, then finalize
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
          DEPLOY_KEY: ${{ secrets.MUDX_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.MUDX_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SSH_HOSTNAME }}
          USER: ${{ secrets.SSH_USERNAME }}
          PORT: ${{ secrets.SSH_PORT }}
          VERSION: ${{ needs.version-pr.outputs.version }}
          SHA: ${{ needs.version-pr.outputs.sha }}
          PRODUCER: ${{ github.run_id }}/${{ github.run_attempt }}
          PACKAGE_ID: mudx.mudblazor.extension
          PUBLIC_URL: ${{ vars.MUDX_PUBLIC_URL }}
        run: tools/release_pipeline/publish_release.sh
  resume-identity:
    if: inputs.mode == 'resume'
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read }
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.candidate.outputs.sha }}
      producer: ${{ steps.candidate.outputs.producer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: dev, persist-credentials: false }
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.producer_run_id }}
          ATTEMPT: ${{ inputs.producer_attempt }}
          ALLOWED: ${{ vars.MUDX_RELEASE_ACTORS }}
        run: |
          test "$GITHUB_REF" = refs/heads/dev
          python3 tools/release_pipeline/release_guard.py actor --actor "$GITHUB_ACTOR" --triggering-actor "$GITHUB_TRIGGERING_ACTOR" --allowed "$ALLOWED"
          [[ "$RUN" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN")
          test "$(jq -r .event <<<"$meta")" = workflow_dispatch
          test "$(jq -r .head_branch <<<"$meta")" = dev
          test "$(jq -r .path <<<"$meta")" = .github/workflows/Release_MudX.yml
          test "$(jq -r .status <<<"$meta")" = completed
          test "$(jq -r .head_repository.full_name <<<"$meta")" = "$GITHUB_REPOSITORY"
          python3 tools/release_pipeline/release_guard.py actor --actor "$(jq -r .actor.login <<<"$meta")" --triggering-actor "$(jq -r '.triggering_actor.login // .actor.login' <<<"$meta")" --allowed "$ALLOWED"
          name="mudx-release-$RUN-$ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" > /tmp/artifacts.json
          artifact=$(python3 tools/release_pipeline/release_guard.py artifact-select --json /tmp/artifacts.json --name "$name" --run "$RUN")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/artifact.zip
          mkdir release-artifacts; unzip -q /tmp/artifact.zip -d release-artifacts
          version=$(jq -r .version release-artifacts/manifest.json); sha=$(jq -r .source_sha release-artifacts/manifest.json)
          python3 tools/release_pipeline/release_guard.py manifest-verify --manifest release-artifacts/manifest.json --root release-artifacts --sha "$sha" --version "$version" --producer "$RUN/$ATTEMPT"
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "producer=$RUN/$ATTEMPT" >> "$GITHUB_OUTPUT"
  resume-publish:
    needs: resume-identity
    runs-on: ubuntu-latest
    environment: mudx-production-release
    permissions: { actions: read, contents: write, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: dev, persist-credentials: false }
      - name: Download exact retained producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ needs.resume-identity.outputs.producer }}
        run: |
          run=${PRODUCER%/*}; attempt=${PRODUCER#*/}; name="mudx-release-$run-$attempt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" > /tmp/artifacts.json
          artifact=$(python3 tools/release_pipeline/release_guard.py artifact-select --json /tmp/artifacts.json --name "$name" --run "$run")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/artifact.zip
          mkdir release-artifacts; unzip -q /tmp/artifact.zip -d release-artifacts
      - name: Revalidate retained candidate before publication credentials
        env:
          VERSION: ${{ needs.resume-identity.outputs.version }}
          SHA: ${{ needs.resume-identity.outputs.sha }}
          PRODUCER: ${{ needs.resume-identity.outputs.producer }}
        run: python3 tools/release_pipeline/release_guard.py manifest-verify --manifest release-artifacts/manifest.json --root release-artifacts --sha "$SHA" --version "$VERSION" --producer "$PRODUCER"
      - name: Reconcile retained candidate and continue only missing stages
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
          DEPLOY_KEY: ${{ secrets.MUDX_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.MUDX_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SSH_HOSTNAME }}
          USER: ${{ secrets.SSH_USERNAME }}
          PORT: ${{ secrets.SSH_PORT }}
          VERSION: ${{ needs.resume-identity.outputs.version }}
          SHA: ${{ needs.resume-identity.outputs.sha }}
          PRODUCER: ${{ needs.resume-identity.outputs.producer }}
          PACKAGE_ID: mudx.mudblazor.extension
          PUBLIC_URL: ${{ vars.MUDX_PUBLIC_URL }}
        run: tools/release_pipeline/publish_release.sh
