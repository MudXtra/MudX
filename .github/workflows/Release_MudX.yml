name: Release MudX
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Start a release or resume a retained candidate
        required: true
        type: choice
        default: release
        options: [release, resume]
      producer_run_id:
        description: Failed producer run ID (resume only)
        required: false
        type: string
      producer_attempt:
        description: Failed producer attempt (resume only)
        required: false
        type: string
      bump:
        description: Version increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      custom_version:
        description: Optional exact stable SemVer instead of bump
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mudx-release
  cancel-in-progress: false
env:
  PROJECT: src/MudX/MudX.csproj
  CI_WORKFLOW: .github/workflows/Build_And_Test.yml
jobs:
  version-pr:
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read, pull-requests: read }
    outputs:
      version: ${{ steps.version.outputs.value }}
      sha: ${{ steps.wait-merged.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: dev, fetch-depth: 0, persist-credentials: false }
      - name: Bind dispatch and rerun actors
        env: { ALLOWED: "${{ vars.MUDX_RELEASE_ACTORS }}" }
        run: python3 tools/release_pipeline/release_guard.py actor --actor "$GITHUB_ACTOR" --triggering-actor "$GITHUB_TRIGGERING_ACTOR" --allowed "$ALLOWED"
      - name: Verify coordinator, MudXBot, and fork identities
        env:
          COORDINATOR_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
          BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          EXPECTED_BOT: ${{ vars.MUDX_BOT_LOGIN }}
          FORK: ${{ vars.MUDX_RELEASE_FORK }}
        run: |
          [[ "$FORK" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$FORK" != "$GITHUB_REPOSITORY" ]]
          coordinator=$(GH_TOKEN="$COORDINATOR_TOKEN" gh api user --jq .login)
          bot=$(GH_TOKEN="$BOT_TOKEN" gh api user --jq .login)
          test -n "$EXPECTED_BOT" && test "$bot" = "$EXPECTED_BOT" && test "$bot" != "$coordinator"
          test "$(GH_TOKEN="$COORDINATOR_TOKEN" gh api "repos/$FORK" --jq .parent.full_name)" = "$GITHUB_REPOSITORY"
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/dev
          test -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[]|select(.headRefName|startswith("release/version-"))][0].headRefName // empty')"
          current=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT")
          mapfile -t known < <({ gh release list --limit 100 --json tagName --jq '.[].tagName|ltrimstr("v")'; curl -fsS https://api.nuget.org/v3-flatcontainer/mudx.mudblazor.extension/index.json | jq -r '.versions[]'; } | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -Vu || true)
          args=(calculate --current "$current"); for value in "${known[@]}"; do args+=(--known "$value"); done
          if [[ -n "$CUSTOM" ]]; then args+=(--custom "$CUSTOM"); else args+=(--bump "$BUMP"); fi
          value=$(python3 tools/release_pipeline/release_guard.py "${args[@]}")
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          FORK: ${{ vars.MUDX_RELEASE_FORK }}
        run: |
          branch="release/version-$VERSION-$GITHUB_RUN_ID"
          git switch -c "$branch"
          cp "$PROJECT" /tmp/before
          python3 - "$PROJECT" "$VERSION" <<'PY'
          from pathlib import Path
          import re,sys
          path=Path(sys.argv[1]); text=path.read_text(); updated,count=re.subn(r'(<Version>)[^<]+(</Version>)',rf'\g<1>{sys.argv[2]}\g<2>',text,count=1)
          if count!=1 or text==updated: raise SystemExit('expected one version change')
          path.write_text(updated)
          PY
          python3 tools/release_pipeline/release_guard.py version-files --before /tmp/before --after "$PROJECT" --expected "$VERSION"
          git config user.name MudXReleaseCoordinator; git config user.email release-coordinator@users.noreply.github.com
          git add "$PROJECT" && git commit -m "Release: reserve MudX $VERSION"
          gh auth setup-git
          git remote add release-fork "https://github.com/$FORK.git"
          git push release-fork "HEAD:$branch"
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "${FORK%%/*}:$branch" --title "[BOT] Update MudX Version to $VERSION" --body "Release run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT; exact version-only reservation.")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Revalidate current head and approve as MudXBot
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          before=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          git fetch --force origin "pull/$PR/head:refs/remotes/origin/release-pr"
          fetched=$(git rev-parse refs/remotes/origin/release-pr)
          after=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          python3 tools/release_pipeline/release_guard.py head-binding --expected "$HEAD" --observed "$before" --observed "$fetched" --observed "$after"
          test "$(git diff --name-only origin/dev...refs/remotes/origin/release-pr)" = "$PROJECT"
          git show origin/dev:"$PROJECT" >/tmp/base; git show refs/remotes/origin/release-pr:"$PROJECT" >/tmp/head
          python3 tools/release_pipeline/release_guard.py version-files --before /tmp/base --after /tmp/head --expected "$VERSION"
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body "MudXBot approval bound to run $GITHUB_RUN_ID and head $HEAD."
      - name: Await successful trusted PR CI for the exact head
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
        run: |
          ci_run=''
          for _ in {1..120}; do
            now=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            python3 tools/release_pipeline/release_guard.py head-binding --expected "$HEAD" --observed "$now"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/Build_And_Test.yml/runs?head_sha=$HEAD&event=pull_request&per_page=100" > /tmp/ci-runs.json
            if ci_run=$(python3 tools/release_pipeline/release_guard.py ci-run --json /tmp/ci-runs.json --sha "$HEAD" --repository "$GITHUB_REPOSITORY" --workflow "$CI_WORKFLOW" --event pull_request); then break; fi
            sleep 15
          done
          test -n "$ci_run" || { echo 'Exact PR-head Build_And_Test did not succeed within 30 minutes.' >&2; exit 1; }
          echo "Trusted PR CI run: $ci_run"
      - name: Merge the still-exact approved version PR
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
        run: |
          now=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          python3 tools/release_pipeline/release_guard.py head-binding --expected "$HEAD" --observed "$now"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --match-head-commit "$HEAD" --squash --delete-branch
      - id: wait-merged
        name: Await the same PR merge and trusted exact merged-SHA CI
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_COORDINATOR_TOKEN }}
        run: |
          sha=''
          for _ in {1..120}; do
            test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$HEAD"
            sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,mergeCommit --jq 'select(.state=="MERGED")|.mergeCommit.oid')
            [[ -n "$sha" ]] && break
            sleep 15
          done
          test -n "$sha" || { echo 'Awaiting the same version PR; do not allocate a new version.' >&2; exit 1; }
          ci_run=''
          for _ in {1..120}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/Build_And_Test.yml/runs?head_sha=$sha&event=push&per_page=100" > /tmp/ci-runs.json
            if ci_run=$(python3 tools/release_pipeline/release_guard.py ci-run --json /tmp/ci-runs.json --sha "$sha" --repository "$GITHUB_REPOSITORY" --workflow "$CI_WORKFLOW" --event push); then break; fi
            sleep 15
          done
          test -n "$ci_run" || { echo 'Exact merged-SHA Build_And_Test did not succeed within 30 minutes.' >&2; exit 1; }
          echo "Trusted merged CI run: $ci_run"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    needs: version-pr
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.version-pr.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.400
      - name: Generate and build every shipped target
        run: |
          dotnet run --project src/MudX.Generator/MudX.Generator.csproj -c Release -f net10.0 -- "$GITHUB_WORKSPACE/src/MudX/wwwroot" "$GITHUB_WORKSPACE/src/MudX/Scripts"
          for framework in net8.0 net9.0 net10.0; do dotnet build "$PROJECT" -c Release -f "$framework"; done
          dotnet build src/MudX.Docs/MudX.Docs.csproj -c Release
      - name: Pack and inspect packages
        env: { VERSION: "${{ needs.version-pr.outputs.version }}" }
        run: |
          mkdir -p release-artifacts/packages
          dotnet pack "$PROJECT" -c Release --no-build -o release-artifacts/packages /p:Version="$VERSION" /p:PackageId=MudX.MudBlazor.Extension
          test "$(find release-artifacts/packages -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' | wc -l)" -eq 1
          test "$(find release-artifacts/packages -maxdepth 1 -type f -name '*.snupkg' | wc -l)" -eq 1
          pwsh tools/CheckStaticAssets.ps1 "$(find release-artifacts/packages -name '*.nupkg' ! -name '*.snupkg' -print -quit)" mudx.min.css mudx.min.js prism.js mudxProvider.js
      - name: Build the versioned linux/amd64 archive
        env:
          VERSION: ${{ needs.version-pr.outputs.version }}
          SHA: ${{ needs.version-pr.outputs.sha }}
        run: |
          image="mudx:$VERSION"
          archive="release-artifacts/MudX-$VERSION-linux-amd64.tar.gz"
          docker build --platform linux/amd64 -t "$image" -f src/MudX.Docs.Hybrid/MudX.Docs.Hybrid/Dockerfile --build-arg SOURCE_REVISION="$SHA" --build-arg RELEASE_VERSION="$VERSION" src
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SHA"
          docker save "$image" | gzip -n -9 > "$archive"
          gzip -t "$archive"
          docker image rm "$image"
          for file in release-artifacts/packages/* "$archive"; do printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"; done | sort -k2 > release-artifacts/SHA256SUMS
          python3 tools/release_pipeline/release_guard.py manifest-create --output release-artifacts/manifest.json --root release-artifacts --sha "$SHA" --version "$VERSION" --producer "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" release-artifacts/packages/* "$archive" release-artifacts/SHA256SUMS
          python3 tools/release_pipeline/release_guard.py manifest-verify --manifest release-artifacts/manifest.json --root release-artifacts --sha "$SHA" --version "$VERSION" --producer "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mudx-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 30
  publish:
    if: inputs.mode == 'release'
    needs: [version-pr, build]
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.version-pr.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 10.0.400 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "mudx-release-${{ github.run_id }}-${{ github.run_attempt }}", path: release-artifacts }
      - name: Authenticate exact producer manifest before publication credentials
        env:
          VERSION: ${{ needs.version-pr.outputs.version }}
          SHA: ${{ needs.version-pr.outputs.sha }}
        run: python3 tools/release_pipeline/release_guard.py manifest-verify --manifest release-artifacts/manifest.json --root release-artifacts --sha "$SHA" --version "$VERSION" --producer "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - name: Publish NuGet packages and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
          VERSION: ${{ needs.version-pr.outputs.version }}
          SHA: ${{ needs.version-pr.outputs.sha }}
          PRODUCER: ${{ github.run_id }}/${{ github.run_attempt }}
          PACKAGE_ID: mudx.mudblazor.extension
        run: tools/release_pipeline/publish_release.sh
  resume-identity:
    if: inputs.mode == 'resume'
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read }
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.candidate.outputs.sha }}
      producer: ${{ steps.candidate.outputs.producer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: dev, persist-credentials: false }
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.producer_run_id }}
          ATTEMPT: ${{ inputs.producer_attempt }}
          ALLOWED: ${{ vars.MUDX_RELEASE_ACTORS }}
        run: |
          test "$GITHUB_REF" = refs/heads/dev
          python3 tools/release_pipeline/release_guard.py actor --actor "$GITHUB_ACTOR" --triggering-actor "$GITHUB_TRIGGERING_ACTOR" --allowed "$ALLOWED"
          [[ "$RUN" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN")
          test "$(jq -r .event <<<"$meta")" = workflow_dispatch
          test "$(jq -r .head_branch <<<"$meta")" = dev
          test "$(jq -r .path <<<"$meta")" = .github/workflows/Release_MudX.yml
          test "$(jq -r .status <<<"$meta")" = completed
          test "$(jq -r .repository.full_name <<<"$meta")" = "$GITHUB_REPOSITORY"
          python3 tools/release_pipeline/release_guard.py actor --actor "$(jq -r .actor.login <<<"$meta")" --triggering-actor "$(jq -r '.triggering_actor.login // .actor.login' <<<"$meta")" --allowed "$ALLOWED"
          name="mudx-release-$RUN-$ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" > /tmp/artifacts.json
          artifact=$(python3 tools/release_pipeline/release_guard.py artifact-select --json /tmp/artifacts.json --name "$name" --run "$RUN")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/artifact.zip
          mkdir release-artifacts; unzip -q /tmp/artifact.zip -d release-artifacts
          version=$(jq -r .version release-artifacts/manifest.json); sha=$(jq -r .source_sha release-artifacts/manifest.json)
          python3 tools/release_pipeline/release_guard.py manifest-verify --manifest release-artifacts/manifest.json --root release-artifacts --sha "$sha" --version "$version" --producer "$RUN/$ATTEMPT"
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "producer=$RUN/$ATTEMPT" >> "$GITHUB_OUTPUT"
  resume-publish:
    needs: resume-identity
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: dev, persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 10.0.400 }
      - name: Download exact retained producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ needs.resume-identity.outputs.producer }}
        run: |
          run=${PRODUCER%/*}; attempt=${PRODUCER#*/}; name="mudx-release-$run-$attempt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" > /tmp/artifacts.json
          artifact=$(python3 tools/release_pipeline/release_guard.py artifact-select --json /tmp/artifacts.json --name "$name" --run "$run")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/artifact.zip
          mkdir release-artifacts; unzip -q /tmp/artifact.zip -d release-artifacts
      - name: Revalidate retained candidate before publication credentials
        env:
          VERSION: ${{ needs.resume-identity.outputs.version }}
          SHA: ${{ needs.resume-identity.outputs.sha }}
          PRODUCER: ${{ needs.resume-identity.outputs.producer }}
        run: python3 tools/release_pipeline/release_guard.py manifest-verify --manifest release-artifacts/manifest.json --root release-artifacts --sha "$SHA" --version "$VERSION" --producer "$PRODUCER"
      - name: Continue only missing publication stages
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
          VERSION: ${{ needs.resume-identity.outputs.version }}
          SHA: ${{ needs.resume-identity.outputs.sha }}
          PRODUCER: ${{ needs.resume-identity.outputs.producer }}
          PACKAGE_ID: mudx.mudblazor.extension
        run: tools/release_pipeline/publish_release.sh
