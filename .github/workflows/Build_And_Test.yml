# .github/workflows/test-coverage.yml

name: Run Test Coverage

on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        # we let this restore all so it stops the workflow before merge
    - name: Restore dependencies
      working-directory: ./src
      run: dotnet restore

    - name: Clean
      working-directory: ./src
      run: dotnet clean

    - name: Build
      working-directory: ./src
      run: dotnet build --no-restore --configuration Release /p:BuildInParallel=false --framework net10.0 -maxcpucount:1

    - name: Run tests with coverage
      run: |
        dotnet test ./tests/MudX.UnitTests/MudX.UnitTests.csproj \
        -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --verbosity normal \
        /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=./TestResults/coverage.xml \
        /p:Exclude="[MudX.UnitTests.Viewer*]*"
        
    - name: Upload to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./tests/MudX.UnitTests/TestResults/coverage.xml
        format: cobertura

    # Optional: Upload coverage file for debugging
    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./tests/MudX.UnitTests/TestResults/coverage.xml

  release-contracts:
    name: Release and deployment contracts
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release workflow contracts
        run: bash tests/ReleasePipelineTests/release-workflow-contracts.sh

      - name: Test docs updater
        run: bash deploy/mudx-docs/tests/update-mudx-docs-tests.sh

      - name: Build docs health host
        run: |
          dotnet restore src/MudX.Docs.Hybrid/MudX.Docs.Hybrid/MudX.Docs.Hybrid.csproj --nologo
          dotnet build src/MudX.Docs.Hybrid/MudX.Docs.Hybrid/MudX.Docs.Hybrid.csproj --no-restore --nologo

      - name: Verify docs health endpoint
        run: DOTNET_BIN=dotnet bash tests/MudX.Docs.Hybrid.Tests/healthz-contract.sh
